# Checks on macOS and Linux. Manual for now (Actions tab > CI > Run workflow); to run on every
# push again, add `push: { branches: [main] }` and `pull_request:` under `on`.
name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf zsh

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: core

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The Tauri build script needs dist/ to exist.
      - run: npm run build
      - run: cargo fmt --check
        working-directory: core
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: core
      - run: cargo test
        working-directory: core
