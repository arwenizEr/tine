name: Bug report
description: Something in tine does not work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a tab in a git repository
        2. Run …
        3. See …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: tine version
      placeholder: "0.1.0, or the commit you built"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and version
      placeholder: "macOS 15.2 (Apple Silicon), Ubuntu 24.04, …"
    validations:
      required: true
  - type: input
    id: shell
    attributes:
      label: Shell and agent, if relevant
      placeholder: "zsh, Claude Code 2.x"
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
      description: Please remove anything private (names, paths, tokens) first.
