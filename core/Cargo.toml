[package]
name = "tine"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
name = "tine_lib"

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
tauri = { version = "2.12.7", features = ["unstable"] } # unstable: a second webview in the main window (web panel)
tauri-plugin-dialog = "2.8.4"
tauri-plugin-notification = "2.8.1"
toml = "0.9.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9.0"
notify = "9.0.0"
# No https/ssh: tine never talks to remotes.
git2 = { version = "0.21.0", default-features = false }
trash = "5.4.0"
