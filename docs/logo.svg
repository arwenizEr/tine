<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c3240"/>
      <stop offset="1" stop-color="#14171d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9cc8ff"/>
      <stop offset="1" stop-color="#4f86ef"/>
    </linearGradient>
  </defs>
  <!-- macOS icon grid: 824px body centred on a 1024px canvas -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>
  <!-- prompt -->
  <polyline points="262,392 392,512 262,632" fill="none" stroke="url(#accent)" stroke-width="68" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="436" y="596" width="150" height="56" rx="14" fill="#e8ebf1"/>
  <!-- the review pane: a divider and diff lines -->
  <rect x="654" y="300" width="8" height="424" rx="4" fill="#ffffff" fill-opacity="0.14"/>
  <rect x="700" y="396" width="118" height="36" rx="18" fill="#5fd38d"/>
  <rect x="700" y="466" width="78" height="36" rx="18" fill="#ff7b72"/>
  <rect x="700" y="536" width="104" height="36" rx="18" fill="#5fd38d"/>
</svg>
